name: seed queues

# The app shows an empty state when there is no queue for today, because
# presenting a stale queue as today's work would be a lie. This keeps the
# example queues current so a fresh clone always demonstrates the gate.
on:
  schedule:
    - cron: "0 10 * * 1-5"   # weekdays, 06:00 America/New_York
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/seed.js
      - name: commit if anything changed
        run: |
          git config user.name "growth desk"
          git config user.email "noreply@growth-desk.local"
          git add products/*/queue/*.json
          git diff --staged --quiet || git commit -m "seed queues for $(date -u +%F)"
          git push
